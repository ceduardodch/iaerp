name: CI

on:
  pull_request:
    branches: [develop, release, main]
  push:
    branches: [develop, release, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: >-
          Desplegar main a produccion al terminar en verde. Sirve para publicar
          un main sano que el filtro de rutas dejo sin desplegar (por ejemplo
          cuando el arreglo solo toco tests o documentacion).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.12"
  UV_VERSION: "0.11.26"
  NODE_VERSION: "24.13.0"

jobs:
  changes:
    name: Detect change impact
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      frontend: ${{ steps.filter.outputs.frontend }}
      oidc: ${{ steps.filter.outputs.oidc }}
      contracts: ${{ steps.filter.outputs.contracts }}
      deployment_config: ${{ steps.filter.outputs.deployment_config }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout history needed for comparison
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed_files=$(git ls-tree -r --name-only HEAD)
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$PR_BASE_SHA" HEAD)
          elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git diff --name-only "$EVENT_BEFORE" HEAD)
          else
            changed_files=$(git ls-tree -r --name-only HEAD)
          fi

          changed() {
            grep -Eq "$1" <<<"$changed_files"
          }
          set_output() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          backend=false
          migrations=false
          frontend=false
          oidc=false
          contracts=false
          deployment_config=false
          deploy=false

          # SRI, facturación, migraciones y configuración de plataforma no
          # pueden tomar atajos: exigen el recorrido completo antes de producción.
          strict=false
          if changed '^(backend/(app/services/(access_key|billing|fiscal_settings|signing|sri_xml)\.py|app/integrations/sri/|migrations/)|compose\.ya?ml|compose\.coolify\.yaml|contracts/)'; then
            strict=true
          fi

          if changed '^backend/'; then backend=true; fi
          if changed '^(backend/(migrations/|app/models/)|compose\.ya?ml|compose\.coolify\.yaml)' || [[ "$strict" == true ]]; then migrations=true; fi
          if changed '^frontend/' || [[ "$strict" == true ]]; then frontend=true; fi
          if changed '^(backend/app/core/|backend/app/api/auth|backend/app/services/(auth|identity)|frontend/src/(auth|oidc)|compose\.ya?ml|infra/keycloak/)' || [[ "$strict" == true ]]; then oidc=true; fi
          if changed '^(contracts/|backend/app/(api|mcp)/|\.github/workflows/)'; then contracts=true; fi
          if changed '^(compose\.coolify\.yaml|compose\.ya?ml|Dockerfile|backend/Dockerfile|frontend/Dockerfile|infra/keycloak/)'; then deployment_config=true; fi
          if changed '^(backend/app/|frontend/src/|compose\.ya?ml|compose\.coolify\.yaml|backend/Dockerfile|frontend/Dockerfile|infra/keycloak/)' ; then deploy=true; fi

          set_output backend "$backend"
          set_output migrations "$migrations"
          set_output frontend "$frontend"
          set_output oidc "$oidc"
          set_output contracts "$contracts"
          set_output deployment_config "$deployment_config"
          set_output deploy "$deploy"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: iaerp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iaerp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/iaerp_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/iaerp_test
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Check PostgreSQL and Redis
        run: uv run --frozen python scripts/check_ci_services.py

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: mypy
        run: uv run --frozen mypy app

      - name: pytest
        run: uv run --frozen pytest -q --junitxml=test-results/pytest.xml

      - name: Upload backend reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-reports
          path: backend/test-results/
          if-no-files-found: warn
          retention-days: 14

  migrations:
    name: PostgreSQL migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/iaerp_migrations
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Validate upgrade, downgrade and schema drift
        run: uv run --frozen python scripts/validate_migrations.py

  contracts:
    name: YAML contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Validate OpenAPI
        run: >-
          uvx --from openapi-spec-validator==0.7.2
          openapi-spec-validator contracts/openapi.yaml

      - name: Validate YAML and MCP references
        run: uv run --no-project --with PyYAML==6.0.2 python scripts/validate_contracts.py

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: iaerp_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iaerp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/iaerp_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Prepare E2E database
        working-directory: backend
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen python -m app.initial_data

      - name: Start API
        working-directory: backend
        run: uv run --frozen uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/iaerp-api.log 2>&1 &

      - name: Wait for API
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health/ready

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: npx playwright test --reporter=list,junit,html

      - name: Print API log on failure
        if: ${{ failure() }}
        working-directory: .
        run: cat /tmp/iaerp-api.log

      - name: Upload Playwright reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-reports
          path: |
            frontend/results.xml
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  oidc:
    name: OIDC and full stack
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        run: |
          cd backend
          uv sync --frozen
          cd ../frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Start OIDC stack
        env:
          AUTH_MODE: oidc
          VITE_AUTH_MODE: oidc
        run: docker compose up -d --build

      - name: Wait for startup readiness
        run: >-
          curl --fail --retry 60 --retry-delay 2 --retry-connrefused
          http://127.0.0.1:8000/health/startup

      - name: Validate Keycloak compatibility profile
        working-directory: backend
        run: uv run --frozen python ../scripts/keycloak_poc.py

      - name: Validate dynamic service-account lifecycle
        working-directory: backend
        run: uv run --frozen python scripts/validate_oidc_runtime.py

      - name: Validate service-account and tenant-switch PoC suites
        working-directory: backend
        env:
          IAERP_POC: "1"
        run: >-
          uv run --frozen pytest -q
          tests/test_service_account_poc.py
          tests/test_tenant_switch_poc.py

      - name: Validate PKCE tenant switch
        working-directory: frontend
        run: npm run test:e2e:oidc

      - name: Verify all services are healthy
        run: docker compose ps

      - name: Print stack logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop OIDC stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Secret baseline check
        run: >-
          git ls-files -z |
          xargs -0 uvx --python 3.12 --from detect-secrets==1.5.0
          detect-secrets-hook --baseline .secrets.baseline

      - name: Python dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --output-file /tmp/iaerp-requirements.txt
          uvx --python 3.12 --from pip-audit==2.9.0 pip-audit \
            --requirement /tmp/iaerp-requirements.txt \
            --progress-spinner off

      - name: Python SAST
        working-directory: backend
        run: >-
          uvx --python 3.12 --from bandit==1.8.6
          bandit -q -ll -r app scripts

      - name: JavaScript dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  deployment-config:
    name: Coolify deployment config
    needs: changes
    if: needs.changes.outputs.deployment_config == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate staging Compose
        run: |
          while read -r variable; do
            export "$variable=ci-placeholder"
          done <<'EOF'
          POSTGRES_PASSWORD
          KEYCLOAK_DB_PASSWORD
          KC_BOOTSTRAP_ADMIN_USERNAME
          KC_BOOTSTRAP_ADMIN_PASSWORD
          OIDC_ADMIN_CLIENT_SECRET
          IAERP_AGENT_NORTE_SECRET
          IAERP_AGENT_SUR_SECRET
          IAERP_OWNER_PASSWORD
          IAERP_OPERATOR_NORTE_PASSWORD
          IAERP_ACCOUNTANT_SUR_PASSWORD
          MINIO_ACCESS_KEY
          MINIO_SECRET_KEY
          IAERP_SIGNING_CERT_PASSWORD
          IAERP_SECRETS_ENCRYPTION_KEY
          EOF
          docker compose -f compose.coolify.yaml config --quiet

  deploy-production:
    name: Deploy production to Coolify
    # Un push a main despliega solo si toco codigo de app (filtro de rutas). Eso
    # dejo un hueco real: cuando el CI de un cambio de app sale rojo, la
    # compuerta lo bloquea bien, pero si el arreglo posterior toca unicamente
    # tests o documentacion, el filtro ya no ve codigo de app y main se queda
    # verde SIN publicar. Por eso workflow_dispatch tambien puede desplegar,
    # pero solo con la casilla marcada a proposito: una corrida manual para
    # revisar algo no debe republicar produccion sin querer.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy)) &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.oidc.result == 'success' || needs.oidc.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.deployment-config.result == 'success' || needs.deployment-config.result == 'skipped')
    needs: [changes, backend, migrations, contracts, frontend, oidc, security, deployment-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Legacy secret scope; this job deploys the production app from main only.
    environment: staging
    steps:
      - name: Trigger gated Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_IAERP_APP_UUID }}
        run: |
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_APP_UUID"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://coolify.fractalsoft.io/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false")
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty' <<<"$response")
          test -n "$deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_ENV"

      - name: Wait for Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          for attempt in $(seq 1 90); do
            response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "https://coolify.fractalsoft.io/api/v1/deployments/$deployment_uuid")
            status=$(jq -r '.status // empty' <<<"$response")
            echo "Coolify deployment status: ${status:-unknown}"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Coolify deployment" >&2
          exit 1
