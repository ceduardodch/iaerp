schemaVersion: "0.1"
status: draft
transport: streamable-http
endpoint: /mcp
authentication:
  type: oauth2.1
  tenantSource: validated-token
defaults:
  additionalProperties: false
  writesRequireIdempotencyKey: true
  auditRequired: true
  policyRequired: true
tools:
  - name: context.get
    effect: read
    scope: context:read
    description: Obtener tenant activo, permisos, limites y kill switch.
    inputSchema:
      type: object
      additionalProperties: false
    outputSchema:
      $ref: openapi.yaml#/components/schemas/TenantContext
  - name: ops.list_failures
    effect: read
    scope: operations:read
    description: Listar fallos operativos terminales del tenant activo.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: [string, "null"]
          enum: [OPEN, RESOLVED, null]
          default: null
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
    outputSchema:
      type: array
      items:
        $ref: "#/$defs/opsFailure"
  - name: tax.process_received_reports
    effect: external-write
    scope: tax:write
    description: Importar reportes recibidos de un dia y pedir sus XML autorizados.
    inputSchema:
      type: object
      additionalProperties: false
      required: [evidenceIds, reportDate, idempotencyKey]
      properties:
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uuid
        reportDate:
          type: string
          format: date
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: "#/$defs/receivedReportsResult"
  - name: parties.search
    effect: read
    scope: parties:read
    description: Buscar clientes y proveedores del tenant activo.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 2
        role:
          type: string
          enum: [CUSTOMER, SUPPLIER]
    outputSchema:
      type: array
      items:
        $ref: openapi.yaml#/components/schemas/Party
  - name: parties.create
    effect: write
    scope: parties:write
    description: Crear un contacto; identificaciones duplicadas producen conflicto.
    inputSchema:
      type: object
      additionalProperties: false
      required: [party, idempotencyKey]
      properties:
        party:
          $ref: openapi.yaml#/components/schemas/PartyInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Party
  - name: products.search
    effect: read
    scope: products:read
    description: Buscar productos del tenant activo.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
    outputSchema:
      type: array
      items:
        $ref: openapi.yaml#/components/schemas/Product
  - name: products.create
    effect: write
    scope: products:write
    description: Crear un producto; codigos duplicados producen conflicto.
    inputSchema:
      type: object
      additionalProperties: false
      required: [product, idempotencyKey]
      properties:
        product:
          $ref: openapi.yaml#/components/schemas/ProductInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Product
  - name: leads.list
    effect: read
    scope: leads:read
    description: Listar leads del tenant activo con filtro de etapa y paginacion.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: [string, "null"]
          enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, NEGOTIATION, WON, LOST, null]
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
        offset:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
    outputSchema:
      type: array
      items:
        $ref: "#/$defs/lead"
  - name: leads.activities
    effect: read
    scope: leads:read
    description: Listar hasta 50 actividades y proximos pasos de un lead.
    inputSchema:
      type: object
      additionalProperties: false
      required: [leadId]
      properties:
        leadId:
          type: string
          format: uuid
    outputSchema:
      type: array
      items:
        $ref: "#/$defs/leadActivity"
  - name: leads.create_with_party
    effect: write
    scope: leads:write
    description: Crear un lead en etapa Nuevo junto con su contacto.
    inputSchema:
      type: object
      additionalProperties: false
      required: [lead, idempotencyKey]
      properties:
        lead:
          $ref: "#/$defs/leadInput"
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: "#/$defs/lead"
  - name: leads.create_activity
    effect: write
    scope: leads:write
    description: Registrar una actividad y proximo paso de un lead.
    inputSchema:
      type: object
      additionalProperties: false
      required: [activity, idempotencyKey]
      properties:
        activity:
          $ref: "#/$defs/leadActivityInput"
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: "#/$defs/leadActivity"
  - name: invoices.get
    effect: read
    scope: invoices:read
    description: Consultar factura, artefactos y estado SRI.
    inputSchema:
      type: object
      additionalProperties: false
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
          format: uuid
    outputSchema:
      $ref: openapi.yaml#/components/schemas/SalesDocument
  - name: invoices.create_draft
    effect: write
    scope: invoices:write
    description: Crear borrador y recalcular totales.
    inputSchema:
      type: object
      additionalProperties: false
      required: [invoice, idempotencyKey]
      properties:
        invoice:
          $ref: openapi.yaml#/components/schemas/InvoiceInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/SalesDocument
  - name: invoices.issue
    effect: external-write
    scope: invoices:issue
    description: Validar, firmar y encolar emision SRI.
    inputSchema:
      type: object
      additionalProperties: false
      required: [invoiceId, idempotencyKey]
      properties:
        invoiceId:
          type: string
          format: uuid
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Operation
  - name: credit_notes.create_and_issue
    effect: external-write
    scope: credit-notes:issue
    description: Crear y encolar nota de credito para factura autorizada.
    inputSchema:
      type: object
      additionalProperties: false
      required: [creditNote, idempotencyKey]
      properties:
        creditNote:
          $ref: openapi.yaml#/components/schemas/CreditNoteInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Operation
  - name: receivables.list
    effect: read
    scope: receivables:read
    description: Consultar cartera por estado y vencimiento.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [OPEN, PARTIAL, OVERDUE, SETTLED]
        dueBefore:
          type: string
          format: date
    outputSchema:
      type: array
      items:
        $ref: openapi.yaml#/components/schemas/AccountItem
  - name: receivables.record_payment
    effect: write
    scope: receivables:write
    description: Registrar y aplicar un cobro, retencion o descuento.
    inputSchema:
      type: object
      additionalProperties: false
      required: [receivableId, payment, idempotencyKey]
      properties:
        receivableId:
          type: string
          format: uuid
        payment:
          $ref: openapi.yaml#/components/schemas/PaymentInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/AccountItem
  - name: receivables.send_reminder
    effect: external-write
    scope: receivables:notify
    description: Encolar recordatorio por email o WhatsApp.
    inputSchema:
      type: object
      additionalProperties: false
      required: [receivableId, reminder, idempotencyKey]
      properties:
        receivableId:
          type: string
          format: uuid
        reminder:
          $ref: openapi.yaml#/components/schemas/ReminderInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Operation
  - name: payables.list
    effect: read
    scope: payables:read
    description: Consultar obligaciones y proximos pagos.
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [OPEN, PARTIAL, SETTLED, VOIDED]
        dueBefore:
          type: string
          format: date
    outputSchema:
      type: array
      items:
        $ref: openapi.yaml#/components/schemas/Payable
  - name: payables.create
    effect: write
    scope: payables:write
    description: Crear obligacion manual.
    inputSchema:
      type: object
      additionalProperties: false
      required: [payable, idempotencyKey]
      properties:
        payable:
          $ref: openapi.yaml#/components/schemas/PayableInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Payable
  - name: payables.create_from_document
    effect: write
    scope: payables:extract
    description: Validar y extraer una obligacion desde XML/PDF.
    inputSchema:
      type: object
      additionalProperties: false
      required: [documentId, idempotencyKey]
      properties:
        documentId:
          type: string
          format: uuid
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Payable
  - name: payables.schedule_payment
    effect: write
    scope: payables:write
    description: Programar pago sin iniciar transferencia.
    inputSchema:
      type: object
      additionalProperties: false
      required: [payableId, schedule, idempotencyKey]
      properties:
        payableId:
          type: string
          format: uuid
        schedule:
          $ref: openapi.yaml#/components/schemas/PaymentScheduleInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Operation
  - name: payables.record_payment
    effect: write
    scope: payables:write
    description: Registrar un pago ya realizado, sin mover dinero.
    inputSchema:
      type: object
      additionalProperties: false
      required: [payableId, payment, idempotencyKey]
      properties:
        payableId:
          type: string
          format: uuid
        payment:
          $ref: openapi.yaml#/components/schemas/SupplierPaymentInput
        idempotencyKey:
          $ref: "#/$defs/idempotencyKey"
    outputSchema:
      $ref: openapi.yaml#/components/schemas/Payable
$defs:
  idempotencyKey:
    type: string
    minLength: 16
    maxLength: 128
  opsFailure:
    type: object
    additionalProperties: false
    required:
      [id, sourceType, sourceId, eventType, error, attempts, status,
       classification, correlationId, aggregateType, aggregateId, createdAt,
       resolvedAt]
    properties:
      id:
        type: string
        format: uuid
      sourceType:
        type: string
      sourceId:
        type: string
        format: uuid
      eventType:
        type: string
      error:
        type: string
      attempts:
        type: integer
        minimum: 0
      status:
        type: string
        enum: [OPEN, RESOLVED]
      classification:
        type: string
        enum: [AUTO_RETRY, NEEDS_HUMAN]
      correlationId:
        type: [string, "null"]
      aggregateType:
        type: [string, "null"]
      aggregateId:
        type: [string, "null"]
      createdAt:
        type: string
        format: date-time
      resolvedAt:
        type: [string, "null"]
        format: date-time
  receivedReportsResult:
    type: object
    additionalProperties: false
    required:
      [reportDate, evidenceCount, listedRows, documentTypes, created, updated,
       skipped, preliminary, recoveryJob]
    properties:
      reportDate:
        type: string
        format: date
      evidenceCount:
        type: integer
        minimum: 1
        maximum: 5
      listedRows:
        type: integer
        minimum: 1
      documentTypes:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      created:
        type: integer
        minimum: 0
      updated:
        type: integer
        minimum: 0
      skipped:
        type: integer
        minimum: 0
      preliminary:
        type: integer
        minimum: 0
      recoveryJob:
        type: object
        additionalProperties: false
        required:
          [id, taxPeriodId, status, totalCount, processedCount, recoveredCount,
           unavailableCount, failedCount, items, startedAt, completedAt]
        properties:
          id:
            type: string
            format: uuid
          taxPeriodId:
            type: string
            format: uuid
          status:
            type: string
          totalCount:
            type: integer
            minimum: 0
          processedCount:
            type: integer
            minimum: 0
          recoveredCount:
            type: integer
            minimum: 0
          unavailableCount:
            type: integer
            minimum: 0
          failedCount:
            type: integer
            minimum: 0
          items:
            type: array
            items:
              type: object
          startedAt:
            type: [string, "null"]
            format: date-time
          completedAt:
            type: [string, "null"]
            format: date-time
  leadInput:
    type: object
    additionalProperties: false
    required: [partyName, partyIdentificationType, partyIdentificationNumber, title]
    anyOf:
      - required: [partyEmail]
      - required: [partyPhone]
    properties:
      partyName:
        type: string
        minLength: 1
        maxLength: 200
      partyIdentificationType:
        type: string
        enum: [RUC, CEDULA, PASSPORT, FINAL_CONSUMER]
      partyIdentificationNumber:
        type: string
        minLength: 1
        maxLength: 30
      partyEmail:
        type: [string, "null"]
        maxLength: 320
      partyPhone:
        type: [string, "null"]
        maxLength: 40
      partyAddress:
        type: [string, "null"]
        maxLength: 500
      title:
        type: string
        minLength: 1
        maxLength: 200
  lead:
    type: object
    additionalProperties: false
    required: [id, title, status, source, score, hotness, party, createdAt]
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
      status:
        type: string
        enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, NEGOTIATION, WON, LOST]
      source:
        type: [string, "null"]
      score:
        type: integer
        minimum: 0
        maximum: 100
      hotness:
        type: string
        enum: [COLD, WARM, HOT]
      party:
        type: object
        additionalProperties: false
        required: [id, name, email, phone]
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          email:
            type: [string, "null"]
          phone:
            type: [string, "null"]
      createdAt:
        type: string
        format: date-time
  leadActivityInput:
    type: object
    additionalProperties: false
    required: [leadId, activityType, subject]
    properties:
      leadId:
        type: string
        format: uuid
      activityType:
        type: string
        enum: [CALL, EMAIL, WHATSAPP, MEETING, NOTE, TASK]
      subject:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: [string, "null"]
        maxLength: 4000
      outcome:
        type: string
        enum: [POSITIVE, NEUTRAL, NEGATIVE, PENDING]
        default: PENDING
      reminderDate:
        type: [string, "null"]
        format: date-time
  leadActivity:
    type: object
    additionalProperties: false
    required:
      [id, leadId, activityType, subject, description, outcome, reminderDate,
       reminderCompleted, createdAt]
    properties:
      id:
        type: string
        format: uuid
      leadId:
        type: string
        format: uuid
      activityType:
        type: string
      subject:
        type: string
      description:
        type: [string, "null"]
      outcome:
        type: string
      reminderDate:
        type: [string, "null"]
        format: date-time
      reminderCompleted:
        type: boolean
      createdAt:
        type: string
        format: date-time
