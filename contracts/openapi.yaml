      responses:
        "201":
          description: Obligacion creada o enlazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /payables/from-document/review:
    post:
      operationId: reviewPayableFromDocument
