      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "202":
          description: Envio encolado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /payables:
    get:
      operationId: listPayables
      summary: Consultar obligaciones
      security:
        - oauth2: ["payables:read"]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, PARTIAL, SETTLED, VOIDED]
        - name: dueBefore
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Obligaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPayable
      summary: Crear obligacion manual
      security:
        - oauth2: ["payables:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayableInput"
      responses:
        "201":
          description: Obligacion creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /finance/operational-summary:
    get:
      operationId: getOperationalFinancialSummary
      summary: Resumir facturacion y movimientos de caja; no es estado contable
      security:
        - oauth2: ["finance:read"]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /payables/from-document:
    post:
      operationId: createPayableFromDocument
      summary: Crear obligacion desde un objeto cargado
      security:
        - oauth2: ["payables:extract"]
