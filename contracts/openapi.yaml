      operationId: reversePayableMovement
      summary: Revertir un movimiento sin borrar su historia
      security:
        - oauth2: ["payables:write"]
      parameters:
        - $ref: "#/components/parameters/PayableId"
        - name: movementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayableReversalInput"
      responses:
        "201":
          description: Reverso registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payable"
  /expense-rules:
    get:
      operationId: listExpenseRecognitionRules
      summary: Consultar reglas de reconocimiento de debitos
      security:
        - oauth2: ["payables:read"]
      responses:
        "200":
          description: Reglas del tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseRecognitionRule"
    post:
      operationId: createExpenseRecognitionRule
      summary: Crear una regla que siempre requiere confirmacion
      security:
        - oauth2: ["payables:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRecognitionRuleInput"
      responses:
        "201":
          description: Regla creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecognitionRule"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.invalid/authorize
          tokenUrl: https://auth.example.invalid/token
          scopes:
            context:read: Leer contexto
            parties:read: Leer contactos
            parties:write: Gestionar contactos
            products:read: Leer productos
            products:write: Gestionar productos
            invoices:read: Leer facturas
            invoices:write: Crear y emitir documentos
            invoices:issue: Emitir facturas
            credit-notes:issue: Emitir notas de credito
            receivables:read: Leer cartera
            receivables:write: Registrar cobros y recordatorios
            receivables:notify: Enviar recordatorios
            payables:read: Leer obligaciones
            payables:write: Crear y pagar obligaciones
            payables:extract: Extraer obligaciones desde documentos
            finance:read: Leer resumen financiero
            memberships:read: Leer membresias propias
            service-accounts:read: Leer service accounts
            service-accounts:write: Gestionar service accounts
            organization:read: Leer configuracion de empresa
            organization:write: Gestionar configuracion de empresa
            tags:read: Leer etiquetas
            tags:write: Gestionar etiquetas
            automation:read: Leer politicas de automatizacion
            automation:write: Gestionar politicas y kill switch
            operations:read: Consultar operaciones asincronas
            tax:write: Importar evidencia tributaria y procesar reportes
        clientCredentials:
          tokenUrl: https://auth.example.invalid/token
          scopes:
            context:read: Leer contexto
            parties:read: Leer contactos
            parties:write: Gestionar contactos
            products:read: Leer productos
            products:write: Gestionar productos
            invoices:read: Leer facturas
            invoices:write: Crear documentos
            invoices:issue: Emitir facturas
            credit-notes:issue: Emitir notas de credito
            receivables:read: Leer cartera
            receivables:write: Registrar cobros
            receivables:notify: Enviar recordatorios
            payables:read: Leer obligaciones
            payables:write: Gestionar obligaciones y pagos
            payables:extract: Extraer obligaciones
            finance:read: Leer resumen operativo
            tax:write: Importar evidencia tributaria y procesar reportes
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReceivableId:
      name: receivableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MovementId:
      name: movementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayableId:
      name: payableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ReceivedReportsProcess:
      type: object
      additionalProperties: false
      required: [evidenceIds, reportYear, reportMonth]
      properties:
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uuid
        reportYear:
          type: integer
          minimum: 2000
          maximum: 2100
        reportMonth:
          type: integer
          minimum: 1
          maximum: 12
    TaxXmlRecoveryJobResult:
      type: object
      additionalProperties: false
      required:
        - id
        - taxPeriodId
        - status
        - totalCount
        - processedCount
        - recoveredCount
        - unavailableCount
        - failedCount
        - items
      properties:
        id:
          type: string
          format: uuid
        taxPeriodId:
          type: string
          format: uuid
        status:
          type: string
        totalCount:
          type: integer
          minimum: 0
        processedCount:
          type: integer
          minimum: 0
        recoveredCount:
          type: integer
          minimum: 0
        unavailableCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [documentId, status]
