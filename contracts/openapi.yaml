openapi: 3.1.0
info:
  title: IAERP API
  version: 0.1.0-draft
  description: Contrato preliminar del MVP. El tenant activo se deriva del token.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.example.invalid/api/v1
security:
  - oauth2: []
paths:
  /context:
    get:
      operationId: getContext
      summary: Obtener tenant, permisos, limites y kill switch
      security:
        - oauth2: ["context:read"]
      responses:
        "200":
          description: Contexto activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /memberships:
    get:
      operationId: listOwnMemberships
      summary: Listar membresias activas del usuario
      security:
        - oauth2: ["memberships:read"]
      responses:
        "200":
          description: Membresias visibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /service-accounts:
    get:
      operationId: listServiceAccounts
      summary: Listar service accounts del tenant activo
      security:
        - oauth2: ["service-accounts:read"]
      responses:
        "200":
          description: Service accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createServiceAccount
      summary: Crear service account ligado al tenant activo
      security:
        - oauth2: ["service-accounts:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAccountInput"
      responses:
        "201":
          description: Service account creado; el secreto solo se entrega una vez
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /service-accounts/{serviceAccountId}:
    delete:
      operationId: revokeServiceAccount
      summary: Revocar un service account del tenant activo
      security:
        - oauth2: ["service-accounts:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Service account revocado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /establishments:
    get:
      operationId: listEstablishments
      summary: Listar establecimientos del tenant
      security:
        - oauth2: ["organization:read"]
      responses:
        "200":
          description: Establecimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createEstablishment
      summary: Crear establecimiento
      security:
        - oauth2: ["organization:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentInput"
      responses:
        "201":
          description: Establecimiento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /establishments/{establishmentId}:
    put:
      operationId: updateEstablishment
      summary: Editar nombre y dirección de un establecimiento del tenant
      security:
        - oauth2: ["organization:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentUpdate"
      responses:
        "200":
          description: Establecimiento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La dirección no puede cambiar mientras un comprobante del establecimiento está en proceso con el SRI, o la clave idempotente ya se usó con otro contenido
  /organization/fiscal-settings:
    get:
      operationId: getFiscalSettings
      summary: Consultar ambiente SRI y metadatos seguros de la firma del tenant
      security:
        - oauth2: ["organization:read"]
      responses:
        "200":
          description: Configuracion fiscal sin secretos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateFiscalSettings
      summary: Cambiar el ambiente SRI del tenant
      security:
        - oauth2: ["organization:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiscalSettingsInput"
      responses:
        "200":
          description: Configuracion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/signing-certificate:
    post:
      operationId: uploadSigningCertificate
      summary: Validar y guardar el certificado PKCS12 privado del tenant
      security:
        - oauth2: ["organization:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, password]
              properties:
                file:
                  type: string
                  format: binary
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Certificado validado y almacenado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /emission-points:
    get:
      operationId: listEmissionPoints
      summary: Listar puntos de emision
      security:
        - oauth2: ["organization:read"]
      responses:
        "200":
          description: Puntos de emision
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmissionPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createEmissionPoint
      summary: Crear punto de emision
      security:
        - oauth2: ["organization:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmissionPointInput"
      responses:
        "201":
          description: Punto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tax/received-reports/process:
    post:
      operationId: processTaxReceivedReports
      summary: Importar los reportes mensuales recibidos del SRI
      description: >-
        Procesa de uno a cinco TXT del mismo mes. El tenant se deriva del
        token, valida que todas las filas pertenezcan a ese tenant y encola la
        recuperación de los XML aún preliminares. Repetir el mes es seguro: la
        clave de acceso evita documentos duplicados.
      security:
        - oauth2: ["tax:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivedReportsProcess"
      responses:
        "201":
          description: Reportes procesados y recuperación de XML encolada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedReportsProcessResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tax-categories:
    get:
      operationId: listTaxCategories
      summary: Listar categorias tributarias vigentes
      security:
        - oauth2: ["organization:read"]
      responses:
        "200":
          description: Categorias tributarias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tags:
    get:
      operationId: listTags
      summary: Listar etiquetas
      security:
        - oauth2: ["tags:read"]
      responses:
        "200":
          description: Etiquetas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTag
      summary: Crear etiqueta
      security:
        - oauth2: ["tags:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Etiqueta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /automation/settings:
    get:
      operationId: getAutomationSettings
      summary: Consultar politicas y kill switch
      security:
        - oauth2: ["automation:read"]
      responses:
        "200":
          description: Configuracion efectiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAutomationSettings
      summary: Actualizar politicas y kill switch
      security:
        - oauth2: ["automation:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationSettingsInput"
      responses:
        "200":
          description: Configuracion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /operations/{operationId}:
    get:
      operationId: getOperation
      summary: Consultar estado de operacion asincrona
      security:
        - oauth2: ["operations:read"]
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado y resultado normalizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /parties:
    get:
      operationId: searchParties
      summary: Buscar clientes y proveedores
      security:
        - oauth2: ["parties:read"]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/PartyRole"
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createParty
      summary: Crear cliente/proveedor
      security:
        - oauth2: ["parties:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: Contacto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /parties/{partyId}:
    put:
      operationId: updateParty
      summary: Editar cliente/proveedor
      security:
        - oauth2: ["parties:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "200":
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /products:
    get:
      operationId: searchProducts
      summary: Buscar productos
      security:
        - oauth2: ["products:read"]
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProduct
      summary: Crear producto
      security:
        - oauth2: ["products:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /products/{productId}:
    put:
      operationId: updateProduct
      summary: Editar producto
      security:
        - oauth2: ["products:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invoices:
    get:
      operationId: listInvoices
      summary: Listar facturas y notas de credito del tenant
      security:
        - oauth2: ["invoices:read"]
      parameters:
        - name: q
          in: query
          description: Coincidencia parcial de secuencial o clave de acceso.
          schema:
            type: string
            minLength: 2
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, READY, SIGNED, RECEIVED, PENDING_AUTHORIZATION, AUTHORIZED, NOT_AUTHORIZED, REJECTED, FAILED, VOIDED]
      responses:
        "200":
          description: Resultados (maximo 100)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvoiceDraft
      summary: Crear borrador de factura
      security:
        - oauth2: ["invoices:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Borrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesDocument"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Consultar factura y estado SRI
      security:
        - oauth2: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /invoices/{invoiceId}/issue:
    post:
      operationId: issueInvoice
      summary: Validar, firmar y encolar emision
      security:
        - oauth2: ["invoices:issue"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Emision aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /invoices/{invoiceId}/artifacts:
    get:
      operationId: listInvoiceArtifacts
      summary: Listar XML firmado y RIDE PDF del comprobante
      security:
        - oauth2: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Artefactos privados disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentArtifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /invoices/{invoiceId}/artifacts/{artifactId}/download:
    get:
      operationId: createInvoiceArtifactDownload
      summary: Crear una descarga privada de corta duracion
      security:
        - oauth2: ["invoices:read"]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: URL prefirmada con nombre y formato de descarga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDownload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /credit-notes:
    post:
      operationId: createAndIssueCreditNote
      summary: Crear y encolar nota de credito relacionada
      security:
        - oauth2: ["credit-notes:issue"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditNoteInput"
      responses:
        "202":
          description: Operacion aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables:
    get:
      operationId: listReceivables
      summary: Consultar cartera
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, PARTIAL, OVERDUE, SETTLED]
        - name: dueBefore
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Cartera
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables/aging:
    get:
      operationId: getReceivablesAging
      summary: Resumen de aging de cartera por bucket de vencimiento (E5-05)
      description: >-
        Aditivo (Sprint 3 Fase 3). Clasifica el saldo abierto de cada cuota
        por bucket de vencimiento respecto a una fecha de corte local
        (America/Guayaquil). Reproducible: mismos datos + mismo asOf =>
        mismo resultado.
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - name: asOf
          in: query
          description: >-
            Fecha de corte local para el calculo de aging. Por defecto hoy
            en America/Guayaquil; se puede fijar para reproducibilidad en
            pruebas.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Resumen de aging
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables/collections:
    get:
      operationId: getReceivablesCollections
      summary: Desglose del cobro entre dinero recibido y valor retenido
      description: >-
        Responde "de lo que cobré, cuánto es efectivo y cuánto retención".
        Una retención baja el saldo igual que un cobro pero no es caja: se
        recupera ante el SRI. Cuenta solo movimientos activos (ni REVERSAL ni
        movimientos ya revertidos), con la misma regla que el saldo de la
        cartera, para que ambos números nunca se contradigan. El rango filtra
        por la fecha real del cobro (effectiveDate).
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - name: from
          in: query
          description: Inicio del rango, sobre la fecha real del cobro.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Fin del rango, sobre la fecha real del cobro.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Desglose del cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables/collections/monthly:
    get:
      operationId: getReceivablesCollectionsMonthly
      summary: Serie mensual de cobro, para leer la tendencia y no solo el total
      description: >-
        Agrupa por mes los mismos movimientos activos que
        /receivables/collections, de modo que la tendencia y el total nunca
        discrepen. Devuelve SIEMPRE todos los meses del rango, con cero donde no
        hubo cobro: una serie con huecos uniría dos meses no contiguos como si
        fueran consecutivos y dibujaría una tendencia falsa.
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - name: months
          in: query
          description: Cantidad de meses de la ventana (1 a 36; por defecto 12).
          schema:
            type: integer
            minimum: 1
            maximum: 36
            default: 12
        - name: asOf
          in: query
          description: >-
            Mes final de la ventana. Por defecto hoy en America/Guayaquil; se
            puede fijar para reproducibilidad en pruebas.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Serie mensual de cobro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionsHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables/bank-statement:
    post:
      operationId: importReceivablesBankStatement
      summary: Conciliar abonos bancarios con facturas autorizadas
      description: >-
        Procesa un TXT bancario en memoria. La vista previa no escribe. Al
        confirmar, registra únicamente abonos del período que cuadran de forma
        única con una factura autorizada del mismo período. Si la factura ya
        tiene un cobro manual sin respaldo y el abono más las retenciones
        documentadas cuadran el total, revierte el manual y registra el banco.
        Ignora débitos y no aplica coincidencias ambiguas o parciales.
      security:
        - oauth2: ["receivables:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Obligatoria al confirmar apply=true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, period, apply]
              properties:
                file:
                  type: string
                  format: binary
                period:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                apply:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Vista previa o resultado del registro confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankStatementImport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Archivo inválido o confirmación sin idempotencia
  /finance/bank-statements:
    post:
      operationId: importFinanceBankStatement
      summary: Conciliar un mismo extracto con CxC y CxP
      description: >-
        Conserva créditos y débitos. La vista previa propone cruces y reglas;
        solo apply=true registra cobros, pagos o evidencia bancaria. Los débitos
        sin respaldo nunca crean por sí solos un gasto fiscal definitivo.
      security:
        - oauth2: ["receivables:write", "payables:write"]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Obligatoria al confirmar apply=true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, period, apply]
              properties:
                file:
                  type: string
                  format: binary
                period:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                apply:
                  type: boolean
                  default: false
                debitAllocations:
                  type: [string, "null"]
                  description: JSON con repartos manuales por transacción, CxP y monto.
      responses:
        "200":
          description: Vista previa o resultado confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankStatementImport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Archivo, reparto o idempotencia inválidos
  /receivables/{receivableId}:
    get:
      operationId: getReceivable
      summary: Consultar el detalle de un receivable
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
        - name: asOf
          in: query
          description: >-
            Aditivo (Sprint 3 Fase 3). Fecha de corte local para el bucket de
            aging y el status OVERDUE derivado; por defecto hoy en
            America/Guayaquil.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Receivable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Receivable no encontrado
  /receivables/{receivableId}/movements/{movementId}/reversal:
    post:
      operationId: reverseReceivableMovement
      summary: Revertir un movimiento como compensacion auditada (E5-09)
      description: >-
        Aditivo (Sprint 3 Fase 3). Crea un Movement tipo REVERSAL que
        referencia el original via reversedMovementId; el original nunca se
        edita ni se borra. No se puede revertir un REVERSAL ni un movimiento
        ya revertido. No expuesto como tool MCP en este sprint (solo
        REST/UI humana).
      security:
        - oauth2: ["receivables:write"]
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
        - $ref: "#/components/parameters/MovementId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversalInput"
      responses:
        "201":
          description: Movimiento revertido, saldo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Receivable o movimiento no encontrado
        "422":
          description: >-
            El movimiento ya fue revertido, o el movimiento es en si mismo
            un REVERSAL
  /receivables/{receivableId}/payments:
    post:
      operationId: recordCustomerPayment
      summary: Registrar y aplicar un cobro
      security:
        - oauth2: ["receivables:write"]
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Cobro registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /receivables/{receivableId}/movements:
    get:
      operationId: listReceivableMovements
      summary: Listar el historial de movimientos de un receivable
      security:
        - oauth2: ["receivables:read"]
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
      responses:
        "200":
          description: Movimientos (cobros, retenciones, descuentos, notas de credito, reversos)
          content:
            application/json:
              schema:
