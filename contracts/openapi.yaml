          format: uuid
        bucket:
          type: string
          enum: [CURRENT, "1-15", "16-30", "31-60", "61-90", "90+"]
        total:
          $ref: "#/components/schemas/NonNegativeDecimal"
        installmentCount:
          type: integer
          minimum: 0
    AgingSummary:
      type: object
      additionalProperties: false
      description: >-
        Aditivo (Sprint 3 Fase 3, E5-05). Resumen de aging por tenant,
        calculado on-demand sobre las cuotas abiertas; reproducible con la
        misma fecha de corte (asOf).
      required: [asOf, buckets, byParty]
      properties:
        asOf:
          type: string
          format: date
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/AgingBucketTotal"
        byParty:
          type: array
          items:
            $ref: "#/components/schemas/PartyAgingBucketTotal"
    CollectionsBreakdown:
      type: object
      additionalProperties: false
      description: >-
        Cómo se cobró en un rango de fechas. cashAmount es dinero que entró
        (PAYMENT); retentionAmount es valor retenido por el cliente
        (RETENTION), recuperable ante el SRI pero no en caja; creditAmount
        agrupa notas de crédito y descuentos, que bajan la deuda sin cobro.
        settledAmount es cash + retención. retentionShare es el porcentaje del
        cobro que se fue en retenciones (0 si no hubo cobro).
      required:
        [
          fromDate,
          toDate,
          cashAmount,
          cashCount,
          retentionAmount,
          retentionCount,
          creditAmount,
          creditCount,
          settledAmount,
          retentionShare,
        ]
      properties:
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
        cashAmount:
          type: string
        cashCount:
          type: integer
          minimum: 0
        retentionAmount:
          type: string
        retentionCount:
          type: integer
          minimum: 0
        creditAmount:
          type: string
        creditCount:
          type: integer
          minimum: 0
        settledAmount:
          type: string
        retentionShare:
          type: string
    MonthlyCollection:
      type: object
      additionalProperties: false
      required: [year, month, cashAmount, retentionAmount, settledAmount]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        cashAmount:
          type: string
        retentionAmount:
          type: string
        settledAmount:
          type: string
    CollectionsHistory:
      type: object
      additionalProperties: false
      description: >-
        Serie mensual de cobro, del mes más viejo al más nuevo y sin huecos.
      required: [months]
      properties:
        months:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyCollection"
    InstallmentInput:
      type: object
      additionalProperties: false
      required: [dueDate, amount]
      properties:
        dueDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
    ReminderInput:
      type: object
      additionalProperties: false
      required: [channel, templateId]
      properties:
        channel:
          type: string
          enum: [EMAIL, WHATSAPP]
        templateId:
          type: string
          format: uuid
    PayableInput:
      type: object
      additionalProperties: false
      required: [description, issueDate, total]
      properties:
        supplierId:
          type: [string, "null"]
          format: uuid
        supplierName:
          type: [string, "null"]
          maxLength: 300
        description:
          type: string
          minLength: 2
          maxLength: 500
        category:
          type: string
          default: Sin clasificar
        documentType:
          type: string
          enum: [INVOICE, LIQUIDATION, DEBIT_NOTE, OTHER]
          default: OTHER
        documentNumber:
          type: [string, "null"]
          maxLength: 80
        issueDate:
          type: string
          format: date
        dueDate:
          type: [string, "null"]
          format: date
        installments:
          type: array
          items:
            $ref: "#/components/schemas/InstallmentInput"
        total:
          $ref: "#/components/schemas/PositiveDecimal"
        taxClassification:
          type: string
          enum: [DEDUCTIBLE_PENDING_REVIEW, DEDUCTIBLE_CONFIRMED, NON_DEDUCTIBLE]
          default: DEDUCTIBLE_PENDING_REVIEW
        evidenceStatus:
          type: string
          enum: [NONE, ATTACHED, PRELIMINARY, FISCAL_XML]
          default: NONE
        supportReference:
          type: [string, "null"]
        paymentTiming:
          type: string
          enum: [PAID_NOW, PAY_LATER]
          default: PAY_LATER
        paymentDate:
          type: [string, "null"]
          format: date
        paymentMethod:
          type: [string, "null"]
          enum: [TRANSFER, CHECK, CASH, CARD, OTHER, null]
        paymentReference:
          type: [string, "null"]
    PayableDocumentReviewInput:
      type: object
      additionalProperties: false
      required: [documentId, taxClassification, paymentState]
      properties:
        documentId:
          type: string
          format: uuid
        taxClassification:
          type: string
          enum: [DEDUCTIBLE_CONFIRMED, NON_DEDUCTIBLE]
        analyticValueIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        paymentState:
          type: string
          enum: [PAID, SCHEDULED, UNCONFIRMED, KEEP_EXISTING]
        paymentDate:
          type: [string, "null"]
          format: date
        paymentMethod:
          type: [string, "null"]
          enum: [TRANSFER, CHECK, CASH, CARD, OTHER, null]
        paymentReference:
          type: [string, "null"]
          maxLength: 300
        scheduledDate:
          type: [string, "null"]
          format: date
    PayableDocumentBulkReviewInput:
      type: object
      additionalProperties: false
      required: [documentIds, taxClassification]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        taxClassification:
          type: string
          enum: [DEDUCTIBLE_CONFIRMED, NON_DEDUCTIBLE]
        analyticChange:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [KEEP_EXISTING, APPLY]
              default: KEEP_EXISTING
            valueIds:
              type: array
              maxItems: 20
              items:
                type: string
                format: uuid
        paymentAction:
          type: string
          enum: [KEEP_EXISTING_OR_UNCONFIRMED, PAID, SCHEDULED]
          default: KEEP_EXISTING_OR_UNCONFIRMED
        paymentDate:
          type: [string, "null"]
          format: date
        paymentMethod:
          type: [string, "null"]
          enum: [TRANSFER, CHECK, CASH, CARD, OTHER, null]
        paymentReference:
          type: [string, "null"]
          maxLength: 300
        scheduledDate:
          type: [string, "null"]
          format: date
    PayableDocumentBulkReviewItem:
      type: object
      additionalProperties: false
      required: [documentId, payableId, status, detail]
      properties:
        documentId:
          type: string
          format: uuid
        payableId:
          type: [string, "null"]
          format: uuid
        status:
          type: string
          enum: [REVIEWED, PROTECTED, SKIPPED, FAILED]
        detail:
          type: string
    PayableDocumentBulkReviewResult:
      type: object
      additionalProperties: false
      required: [reviewedCount, protectedCount, skippedCount, failedCount, items]
      properties:
        reviewedCount:
          type: integer
          minimum: 0
        protectedCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayableDocumentBulkReviewItem"
    SupplierPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, paymentDate]
      properties:
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        paymentDate:
          type: string
          format: date
        method:
          type: [string, "null"]
          enum: [TRANSFER, CHECK, CASH, CARD, OTHER, null]
        reference:
          type: [string, "null"]
          maxLength: 300
    PayableAdjustmentInput:
      type: object
      additionalProperties: false
      required: [movementType, amount, effectiveDate, reference]
      properties:
        movementType:
          type: string
          enum: [RETENTION, CREDIT_NOTE]
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        effectiveDate:
          type: string
          format: date
        reference:
          type: string
          minLength: 3
    PayableReversalInput:
      type: object
      additionalProperties: false
      required: [reason, effectiveDate]
      properties:
        reason:
          type: string
          minLength: 3
        effectiveDate:
          type: string
          format: date
    Payable:
      type: object
      additionalProperties: false
      required: [id, description, category, documentType, issueDate, dueDate, total, openAmount, currency, status, taxClassification, evidenceStatus]
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: [string, "null"]
          format: uuid
        supplierName:
          type: [string, "null"]
        fiscalDocumentId:
          type: [string, "null"]
          format: uuid
        description:
          type: string
        category:
          type: string
        documentType:
          type: string
        documentNumber:
          type: [string, "null"]
        issueDate:
          type: string
          format: date
        dueDate:
          type: [string, "null"]
          format: date
        total:
          $ref: "#/components/schemas/PositiveDecimal"
        openAmount:
          $ref: "#/components/schemas/NonNegativeDecimal"
        currency:
          type: string
          enum: [USD]
        status:
          type: string
          enum: [OPEN, PARTIAL, SETTLED, VOIDED]
        taxClassification:
          type: string
          enum: [DEDUCTIBLE_PENDING_REVIEW, DEDUCTIBLE_CONFIRMED, NON_DEDUCTIBLE]
        evidenceStatus:
          type: string
          enum: [NONE, ATTACHED, PRELIMINARY, FISCAL_XML]
        supportReference:
          type: [string, "null"]
    PayableMovement:
      type: object
      additionalProperties: false
      required: [id, payableId, installmentId, movementType, amount, effectiveDate, actorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        payableId:
          type: string
          format: uuid
        installmentId:
          type: string
          format: uuid
        movementType:
          type: string
          enum: [PAYMENT, RETENTION, CREDIT_NOTE, REVERSAL]
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        effectiveDate:
          type: string
          format: date
        method:
          type: [string, "null"]
          enum: [TRANSFER, CHECK, CASH, CARD, OTHER, null]
        supportReference:
          type: [string, "null"]
        reversedMovementId:
          type: [string, "null"]
          format: uuid
        actorId:
          type: string
        createdAt:
          type: string
          format: date-time
    ExpenseRecognitionRuleInput:
      type: object
      additionalProperties: false
      required: [name, descriptionPattern, category]
      properties:
        name:
          type: string
          minLength: 2
        descriptionPattern:
          type: string
          minLength: 2
        accountLast4:
          type: [string, "null"]
          pattern: '^\d{4}$'
        amountMin:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeDecimal"
            - type: "null"
        amountMax:
          oneOf:
            - $ref: "#/components/schemas/NonNegativeDecimal"
            - type: "null"
        category:
          type: string
          minLength: 2
        supplierName:
          type: [string, "null"]
        taxClassification:
          type: string
          enum: [DEDUCTIBLE_PENDING_REVIEW, DEDUCTIBLE_CONFIRMED, NON_DEDUCTIBLE]
          default: DEDUCTIBLE_PENDING_REVIEW
        active:
          type: boolean
          default: true
    ExpenseRecognitionRule:
      allOf:
        - $ref: "#/components/schemas/ExpenseRecognitionRuleInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    PaymentScheduleInput:
      type: object
      additionalProperties: false
      required: [scheduledDate, amount, priority]
      properties:
        scheduledDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, CRITICAL]
    PaymentSchedule:
      type: object
      additionalProperties: false
      required: [id, payableId, scheduledDate, amount, priority, status]
      properties:
        id:
          type: string
          format: uuid
        payableId:
          type: string
          format: uuid
        scheduledDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/PositiveDecimal"
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, CRITICAL]
        status:
          type: string
    Operation:
      type: object
      additionalProperties: false
      required: [operationId, status, correlationId, createdAt, expiresAt]
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, RUNNING, SUCCEEDED, FAILED, BLOCKED]
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        result:
          type: [object, "null"]
          additionalProperties: true
        error:
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
    OperationalSummary:
      type: object
      additionalProperties: false
      description: Metricas operativas por fechas de emision y movimiento; no aplica devengo contable.
      required: [from, to, invoiced, credited, collected, paid, receivableOpen, payableOpen]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        invoiced:
          $ref: "#/components/schemas/NonNegativeDecimal"
        credited:
          $ref: "#/components/schemas/NonNegativeDecimal"
        collected:
          $ref: "#/components/schemas/NonNegativeDecimal"
        paid:
          $ref: "#/components/schemas/NonNegativeDecimal"
        receivableOpen:
          $ref: "#/components/schemas/NonNegativeDecimal"
        payableOpen:
          $ref: "#/components/schemas/NonNegativeDecimal"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
  responses:
    Unauthorized:
      description: Token ausente, invalido o sin contexto autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Scope, rol, politica o membresia insuficiente
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer error con scope requerido cuando aplique
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No encontrado o no visible en el tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto de estado, duplicado o idempotencia
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos invalidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
