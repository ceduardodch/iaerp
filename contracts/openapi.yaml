          $ref: "#/components/responses/Forbidden"
  /payables/{payableId}:
    get:
      operationId: getPayable
      summary: Consultar una cuenta por pagar
      security:
        - oauth2: ["payables:read"]
      parameters:
        - $ref: "#/components/parameters/PayableId"
